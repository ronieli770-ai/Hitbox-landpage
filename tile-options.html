<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<title>אפשרויות גלילה לכרטיסיות סקשן 2 — HITBOX</title>
<style>
@font-face{font-family:'Fb';src:url('פונט/FbReissfeder-Regular.otf') format('opentype');font-weight:400;font-display:swap;}
@font-face{font-family:'Fb';src:url('פונט/FbReissfeder-Bold.otf') format('opentype');font-weight:700;font-display:swap;}

:root{--ink:#101c1d;--teal:#3e6e72;--sand:#fff3b7;--r:20px;
  --pad:clamp(20px,8.5vw,36px);--h3:clamp(18px,5.5vw,24px);}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{overflow-x:clip;}
body{background:var(--ink);color:#fff;font-family:'Fb',sans-serif;direction:rtl;
  line-height:1.5;overflow-x:clip;padding-bottom:60vh;}

header{padding:40px var(--pad) 0;}
header h1{font-size:clamp(26px,7.5vw,34px);font-weight:700;line-height:1.02;}
header h1 span{color:var(--sand);}
header p{margin-top:12px;font-size:15px;color:#a8c0c2;}

section{padding:34vh var(--pad) 0;}
.hd{display:flex;align-items:baseline;gap:10px;}
.hd b{font-size:var(--h3);font-weight:700;}
.hd i{font-style:normal;font-size:13px;color:var(--sand);border:1px solid var(--sand);
  border-radius:999px;padding:2px 9px;flex:none;}
.note{margin:6px 0 18px;font-size:14.5px;color:#a8c0c2;}

/* ---------- הכרטיסייה עצמה, זהה בכל האפשרויות ---------- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px 12px;}
.tile{border:1px solid var(--teal);border-radius:var(--r);background:rgba(255,255,255,.1);
  padding:16px 8px;min-height:228px;display:flex;flex-direction:column;
  align-items:center;justify-content:flex-start;}
.tile img{width:clamp(52px,16.5vw,70px);height:auto;flex:none;}
.tile h3{margin-top:auto;margin-bottom:auto;font-size:var(--h3);font-weight:700;
  line-height:1.03;text-align:center;width:90%;}

/* ============ 1 · עלייה מטושטשת (זו של הדסקטופ) ============ */
[data-fx="rise"] .tile{opacity:0;transform:translateY(52px);filter:blur(16px);}
[data-fx="rise"].go .tile{opacity:1;transform:none;filter:none;
  transition:opacity .7s ease var(--d),transform .95s cubic-bezier(.16,1,.3,1) var(--d),
             filter .85s ease var(--d);}

/* ============ 2 · קפיצה מהמרכז ============ */
[data-fx="pop"] .tile{opacity:0;transform:scale(.72);}
[data-fx="pop"].go .tile{opacity:1;transform:none;
  transition:opacity .3s ease var(--d),transform .7s cubic-bezier(.34,1.56,.64,1) var(--d);}

/* ============ 3 · קלף מתהפך ============ */
[data-fx="flip"]{perspective:900px;}
[data-fx="flip"] .tile{opacity:0;transform:rotateX(-72deg);transform-origin:center top;}
[data-fx="flip"].go .tile{opacity:1;transform:none;
  transition:opacity .4s ease var(--d),transform .85s cubic-bezier(.22,1,.36,1) var(--d);}

/* ============ 4 · לסירוגין מהצדדים ============ */
[data-fx="sides"] .tile{opacity:0;}
[data-fx="sides"] .tile:nth-child(odd){transform:translateX(46px);}
[data-fx="sides"] .tile:nth-child(even){transform:translateX(-46px);}
[data-fx="sides"].go .tile{opacity:1;transform:none;
  transition:opacity .5s ease var(--d),transform .8s cubic-bezier(.22,1,.36,1) var(--d);}

/* ============ 5 · וילון נפתח ============ */
[data-fx="wipe"] .tile{clip-path:inset(0 0 100% 0);}
[data-fx="wipe"].go .tile{clip-path:inset(0 0 0 0);
  transition:clip-path .8s cubic-bezier(.22,1,.36,1) var(--d);}

/* ============ 6 · סקראב רציף ============ */
/* בלי transition — כל ערך נקבע ישירות מהגלילה, ב-JS */

@media (prefers-reduced-motion:reduce){
  .tile{opacity:1 !important;transform:none !important;filter:none !important;
    clip-path:none !important;}
}
</style>
</head>
<body>

<header>
  <h1>כרטיסיות סקשן 2 — <span>שש אפשרויות גלילה</span></h1>
  <p>גללי לאט. חמש הראשונות נורות פעם אחת כשהרשת נכנסת למסך; השישית קשורה לגלילה עצמה, כלומר אם תעצרי באמצע היא תעצור איתך.</p>
</header>

<div id="app"></div>

<script>
const TILES = [
  'מתאמן כבר תקופה אבל התוצאות פשוט לא מגיעות?',
  'נמאס לך להשתעמם באימונים ולחכות בתור למכשירים?',
  'מסיים את יום העבודה מוצף בלחצים ועם שרירים תפוסים?',
  'מרגיש שאין לך יכולת אמיתית להגן על עצמך ועל המשפחה?'
];

const FX = [
  { id: 'rise', n: 'עלייה מטושטשת', step: 90,
    d: 'הכרטיסייה עולה 52 פיקסלים ומתחדדת מטשטוש. זו בדיוק ההנפשה שרצה בדסקטופ, כך שהעמודים יישמעו אותו דבר.' },
  { id: 'pop', n: 'קפיצה מהמרכז', step: 80,
    d: 'נכנסת קטנה וחורגת מעט מגודלה לפני שהיא מתיישבת. אנרגטית, מתאימה לשפה של האתר.' },
  { id: 'flip', n: 'קלף מתהפך', step: 100,
    d: 'מסתובבת סביב הקצה העליון כמו קלף שנופל למקומו. הכי דרמטית — ובארבע כרטיסיות זה יכול להיות הרבה.' },
  { id: 'sides', n: 'לסירוגין מהצדדים', step: 70,
    d: 'הימנית נכנסת מימין והשמאלית משמאל, שורה אחרי שורה. מדגישה שזו רשת של זוגות.' },
  { id: 'wipe', n: 'וילון נפתח', step: 90,
    d: 'הכרטיסייה נחשפת מלמעלה למטה בלי לזוז. הכי שקטה, והטקסט לא רועד בזמן הכניסה.' },
  { id: 'scrub', n: 'סקראב רציף', step: 0,
    d: 'הכניסה קשורה ישירות למיקום הגלילה: כל כרטיסייה נפתחת ככל שהיא עולה במסך, ונסגרת אם תגללי אחורה. זו היחידה שבאמת נפתחת "תוך כדי" ולא נורית פעם אחת.' }
];

document.getElementById('app').innerHTML = FX.map((f, k) => `
  <section>
    <div class="hd"><i>${k + 1}</i><b>${f.n}</b></div>
    <p class="note">${f.d}</p>
    <div class="grid2" data-fx="${f.id}">
      ${TILES.map((t, i) => `
        <div class="tile" style="--d:${i * f.step}ms">
          <img src="assets/card-icon.png" alt=""><h3>${t}</h3>
        </div>`).join('')}
    </div>
  </section>`).join('');

/* חמש הראשונות: נורות פעם אחת כשהרשת נכנסת למסך */
const once = new IntersectionObserver(es => es.forEach(e => {
  if (!e.isIntersecting) return;
  e.target.classList.add('go');
  once.unobserve(e.target);
}), { rootMargin: '0px 0px -14% 0px' });
document.querySelectorAll('.grid2:not([data-fx="scrub"])').forEach(g => once.observe(g));

/* השישית: כל ערך נגזר ממיקום הכרטיסייה במסך, בלי transition */
(function () {
  const tiles = [...document.querySelectorAll('[data-fx="scrub"] .tile')];
  if (!tiles.length) return;
  const clamp = t => t < 0 ? 0 : t > 1 ? 1 : t;
  const ease = t => 1 - Math.pow(1 - t, 3);
  let queued = false;
  function sync() {
    queued = false;
    tiles.forEach(el => {
      const r = el.getBoundingClientRect();
      /* 0 כשראש הכרטיסייה בתחתית המסך, 1 כשהוא הגיע לשני שליש מלמעלה */
      const t = ease(clamp((innerHeight - r.top) / (innerHeight * 0.42)));
      el.style.opacity = t.toFixed(3);
      el.style.transform = `translateY(${((1 - t) * 60).toFixed(1)}px) scale(${(0.88 + t * 0.12).toFixed(4)})`;
      el.style.filter = t > .98 ? 'none' : `blur(${((1 - t) * 10).toFixed(2)}px)`;
    });
  }
  addEventListener('scroll', () => {
    if (queued) return;
    queued = true;
    requestAnimationFrame(sync);
  }, { passive: true });
  addEventListener('resize', sync);
  sync();
})();
</script>
</body>
</html>
