<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<title>אפשרויות גלילה לסקשן מתחילים מאפס — HITBOX</title>
<style>
@font-face{font-family:'Fb';src:url('פונט/FbReissfeder-Regular.otf') format('opentype');font-weight:400;font-display:swap;}
@font-face{font-family:'Fb';src:url('פונט/FbReissfeder-Bold.otf') format('opentype');font-weight:700;font-display:swap;}

:root{--ink:#101c1d;--teal:#3e6e72;--sand:#fff3b7;--r:20px;
  --pad:clamp(20px,8.5vw,36px);--h2:clamp(27px,8.75vw,38px);
  --h3:clamp(18px,5.5vw,24px);--body:clamp(15px,4.5vw,19px);}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{overflow-x:clip;}
body{background:var(--ink);color:#fff;font-family:'Fb',sans-serif;direction:rtl;
  line-height:1.5;overflow-x:clip;padding-bottom:70vh;}

header{padding:40px var(--pad) 0;}
header h1{font-size:clamp(26px,7.5vw,34px);font-weight:700;line-height:1.02;}
header h1 span{color:var(--sand);}
header p{margin-top:12px;font-size:15px;color:#a8c0c2;}
header p b{color:var(--sand);font-weight:700;}

.lead-in{padding:46vh var(--pad) 0;}
.hd{display:flex;align-items:baseline;gap:10px;}
.hd b{font-size:var(--h3);font-weight:700;}
.hd i{font-style:normal;font-size:13px;color:var(--sand);border:1px solid var(--sand);
  border-radius:999px;padding:2px 9px;flex:none;}
.note{margin:6px 0 18px;font-size:14.5px;color:#a8c0c2;}
.bar{margin:0 var(--pad) 0;height:3px;background:rgba(255,255,255,.12);
  border-radius:2px;overflow:hidden;}
.bar i{display:block;height:100%;width:0;background:var(--sand);}

/* ---------- הסקשן האמיתי, זהה בכל האפשרויות ---------- */
.zero{position:relative;overflow:hidden;background:var(--teal);padding:52px var(--pad);}
.zero::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:url('assets/texture-m.jpg') center/cover;mix-blend-mode:multiply;opacity:.4;}
.zero>*{position:relative;}
.zero h2{font-size:var(--h2);font-weight:700;line-height:.99;text-align:center;}
.zero h2 .y{color:var(--sand);}
.zero .lead{margin-top:14px;font-size:var(--body);line-height:1.29;
  text-align:center;color:rgba(255,255,255,.7);}
.cards{display:flex;flex-direction:column;gap:30px;margin-top:28px;}
.card{background:var(--ink);border-radius:var(--r);padding:20px 29px;min-height:136px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 4px var(--sand);will-change:transform,opacity;}
.card p{font-size:var(--h3);font-weight:700;line-height:1.03;text-align:center;}
.card .y{color:var(--sand);}

@media (prefers-reduced-motion:reduce){
  .card{opacity:1 !important;transform:none !important;}
}
</style>
</head>
<body>

<header>
  <h1>מתחילים מאפס — <span>חמש אפשרויות גלילה</span></h1>
  <p><b>כולן ממשפחת ההחלקה מהצדדים</b> שבחרת לסקשן 2, ובכולן ההיחשפות קשורה לגלילה: עוצרת איתך, נסוגה אחורה. הפס הצהוב מעל כל סקשן מראה בכמה הוא נמצא.</p>
</header>

<div id="app"></div>

<script>
const CARDS = [
  ['מקסימום 12 מתאמנים בקבוצה', ', מאמן שמכיר אותך בשם עובר בין הזוגות ומתקן תוך כדי.'],
  ['לומדים טכניקה מהיסוד בקצב שלך.', ' גם מי שלא התאמן עשור מסיים את האימון על הרגליים.'],
  ['עובדים על שקים, לפות ובזוגות.', ' כל שיטה בונה כושר אחר, והשילוב ביניהן הוא מה שמקדם אותך.']
];

const clamp = t => t < 0 ? 0 : t > 1 ? 1 : t;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const backOut = t => 1 + 2.4 * Math.pow(t - 1, 3) + 1.4 * Math.pow(t - 1, 2);

const FX = [
  { id: 'alt', n: 'לסירוגין מהצדדים',
    d: 'הראשון נכנס מימין, השני משמאל, השלישי מימין. התרגום הישיר של מה שבחרת לסקשן 2 לטור אחד.',
    at(el, t, i) {
      const dir = i % 2 ? -1 : 1;
      el.style.opacity = t.toFixed(3);
      el.style.transform = `translateX(${(dir * (1 - easeOut(t)) * 46).toFixed(1)}px)`;
    } },

  { id: 'same', n: 'כולם מאותו צד',
    d: 'שלושתם נכנסים מימין, בזה אחר זה. שקטה יותר — העין לא נזרקת מצד לצד בכל כרטיס.',
    at(el, t) {
      el.style.opacity = t.toFixed(3);
      el.style.transform = `translateX(${((1 - easeOut(t)) * 52).toFixed(1)}px)`;
    } },

  { id: 'deal', n: 'לסירוגין עם הטיה',
    d: 'נכנסים מהצדדים עם סיבוב קל שמתיישר בסוף, כמו קלפים שנחלקים על שולחן.',
    at(el, t, i) {
      const dir = i % 2 ? -1 : 1, e = easeOut(t);
      el.style.opacity = t.toFixed(3);
      el.style.transform =
        `translateX(${(dir * (1 - e) * 46).toFixed(1)}px) rotate(${(dir * (1 - e) * 4).toFixed(2)}deg)`;
    } },

  { id: 'over', n: 'לסירוגין עם חריגה',
    d: 'עוברים מעט את מקומם וחוזרים אליו. אותה קפיצה שיש באקורדיון ההתנגדויות.',
    at(el, t, i) {
      const dir = i % 2 ? -1 : 1;
      el.style.opacity = clamp(t * 2).toFixed(3);
      el.style.transform = `translateX(${(dir * (1 - backOut(t)) * 46).toFixed(1)}px)`;
    } },

  { id: 'glow', n: 'לסירוגין, הזוהר אחרון',
    d: 'הכרטיס נוחת ורק אז הזוהר הצהוב נדלק מתחתיו. מדגישה את הפרט שמייחד את הסקשן הזה.',
    at(el, t, i) {
      const dir = i % 2 ? -1 : 1, e = easeOut(t);
      el.style.opacity = t.toFixed(3);
      el.style.transform = `translateX(${(dir * (1 - e) * 46).toFixed(1)}px)`;
      /* הזוהר מתחיל להידלק רק אחרי שהכרטיס כמעט הגיע */
      const g = clamp((t - 0.72) / 0.28);
      el.style.boxShadow = `0 ${(8 * g).toFixed(1)}px ${(4 * g).toFixed(1)}px rgba(255,243,183,${g.toFixed(3)})`;
    } }
];

document.getElementById('app').innerHTML = FX.map((f, k) => `
  <div class="lead-in">
    <div class="hd"><i>${k + 1}</i><b>${f.n}</b></div>
    <p class="note">${f.d}</p>
  </div>
  <div class="bar"><i></i></div>
  <section class="zero" data-fx="${f.id}">
    <h2><span class="y">מתחילים מאפס.</span> בלי ניסיון קודם, בעוצמה מבוקרת.</h2>
    <p class="lead">רוב מי שנכנס אלינו לא נגע בכפפות בחיים. אחרי רבע שעה באימון הראשון כבר תרגיש בנוח.</p>
    <div class="cards">
      ${CARDS.map(c => `<div class="card"><p><span class="y">${c[0]}</span>${c[1]}</p></div>`).join('')}
    </div>
  </section>`).join('');

/* ---------- המנוע ----------
   ההתקדמות נמדדת לכל כרטיס מהמיקום שלו עצמו ולא ממיקום הסקשן. כשמדדנו
   מהסקשן, הכרטיסים — שיושבים כמאתיים פיקסלים מתחת לכותרת — סיימו את
   הכניסה עוד לפני שהגיעו למסך, ולכן לא נראתה שום תנועה. */
const ENTER_AT = 0.92;   /* היכן במסך הכרטיס מתחיל להיכנס */
const ENTER_OVER = 0.42; /* על פני כמה מגובה המסך הכניסה נמשכת */

function progress(el) {
  return clamp((innerHeight * ENTER_AT - el.getBoundingClientRect().top) / (innerHeight * ENTER_OVER));
}

const blocks = FX.map(f => {
  const sec = document.querySelector(`[data-fx="${f.id}"]`);
  return { fx: f, sec, cards: [...sec.querySelectorAll('.card')],
           bar: sec.previousElementSibling.firstElementChild };
});

let queued = false;
function sync() {
  queued = false;
  for (const { fx, cards, bar } of blocks) {
    cards.forEach((el, i) => fx.at(el, progress(el), i));
    bar.style.width = (progress(cards[0]) * 100).toFixed(1) + '%';
  }
}
addEventListener('scroll', () => {
  if (queued) return;
  queued = true;
  requestAnimationFrame(sync);
}, { passive: true });
addEventListener('resize', sync);
addEventListener('load', sync);
sync();
</script>
</body>
</html>
