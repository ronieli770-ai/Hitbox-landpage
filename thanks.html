<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<title>תודה שהשארת פרטים — HITBOX</title>
<style>
@font-face{font-family:'FbReissfeder';src:url('פונט/FbReissfeder-Regular.otf') format('opentype');font-weight:400;}
@font-face{font-family:'FbReissfeder';src:url('פונט/FbReissfeder-Bold.otf') format('opentype');font-weight:700;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#101c1d;color:#fff;font-family:'FbReissfeder',sans-serif;direction:rtl;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  padding:48px 24px 64px;position:relative;overflow-x:hidden;}
/* אותה טקסטורה שרצה על כל הדף הראשי */
body::before{content:'';position:fixed;inset:0;background:url('assets/texture.png') center/cover;
  mix-blend-mode:multiply;opacity:.35;pointer-events:none;}
main{position:relative;width:100%;max-width:1200px;display:flex;flex-direction:column;align-items:center;}

.logo{width:104px;height:auto;margin-bottom:34px;}
h1{font-size:clamp(44px,6vw,86px);font-weight:700;line-height:.99;text-align:center;}
h1 span{color:#fff3b7;}
.lead{margin-top:20px;font-size:clamp(18px,2.2vw,26px);line-height:1.57;text-align:center;max-width:760px;}
.note{margin-top:10px;font-size:16px;line-height:1.57;text-align:center;color:#fff;}

h2{margin-top:64px;font-size:clamp(26px,3.2vw,40px);font-weight:700;line-height:1.03;text-align:center;}
.grid{margin-top:28px;display:flex;flex-wrap:wrap;gap:26px;justify-content:center;}
.card{width:271px;height:314px;border-radius:20px;background:#d9d9d9;overflow:hidden;
  border:0;padding:0;cursor:pointer;position:relative;display:block;font-family:inherit;
  transition:transform .25s ease,box-shadow .25s ease;}
.card:hover,.card:focus-visible{outline:none;transform:translateY(-4px);box-shadow:0 8px 4px #fff3b7;}
.card video,.card img{width:100%;height:100%;object-fit:cover;display:block;}
.card .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(16,28,29,.25);opacity:0;transition:opacity .25s ease;}
.card:hover .play{opacity:1;}
.card .play svg{width:64px;height:64px;}

/* אייקונים בלבד, בשורה אחת. 64 פיקסלים הוא יעד המגע המומלץ בטלפון,
   ו-22 ביניהם מספיקים כדי שלא ילחצו על השכן בטעות. */
.social{margin-top:64px;display:flex;gap:22px;justify-content:center;align-items:center;}
.social a{display:inline-flex;align-items:center;justify-content:center;
  width:64px;height:64px;border-radius:50%;flex:none;
  border:2px solid #fff3b7;color:#fff3b7;text-decoration:none;
  transition:background-color .25s ease,color .25s ease,transform .25s ease;}
.social a:hover,.social a:focus-visible{outline:none;background:#fff3b7;color:#101c1d;
  transform:translateY(-3px);}
.social svg{width:30px;height:30px;fill:currentColor;flex:none;}

.back{margin-top:48px;font-size:18px;color:#8ba3a5;text-decoration:none;}
.back:hover{color:#fff3b7;}

#modal{position:fixed;inset:0;z-index:50;background:rgba(16,28,29,.92);display:none;
  align-items:center;justify-content:center;}
#modal.open{display:flex;}
#modal .frame{height:50vh;aspect-ratio:9/16;max-width:92vw;border-radius:20px;overflow:hidden;background:#000;}
#modal iframe{width:100%;height:100%;border:0;display:block;}
#close{position:absolute;top:24px;left:24px;width:48px;height:48px;border-radius:50%;border:0;
  background:#fff3b7;color:#101c1d;font-size:28px;line-height:1;cursor:pointer;}
</style>
</head>
<body>

  <img class="logo" src="assets/logo-hitbox.png" alt="HITBOX">

</main>
